
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NLP Nexus - Word Cloud</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    <link
        rel="icon"
        type="image/jpeg"
        href="{{ url_for('static', filename='images/icons.jpg') }}"
    >
</head>

<body>

<header>
    <h1>Word Cloud</h1>
</header>

<div class="answer">

    <!-- Generated WordCloud -->

    <img
        class="wordcloud-image"
        src="data:image/png;base64,{{ image_data }}"
        alt="Generated Word Cloud"
    >

    <br><br>

    <!-- Download WordCloud -->

    <a
        class="download-btn"
        href="data:image/png;base64,{{ image_data }}"
        download="NLP_Nexus_WordCloud.png"
    >
        Download WordCloud
    </a>

    <br><br>

    <!-- Back to Home -->

    <a href="{{ url_for('index') }}" class="back-link">
        ← Back to Home
    </a>

</div>

<footer>
    <p>&copy; 2026 NLP Nexus</p>
</footer>

</body>
</html>
